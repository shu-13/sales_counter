<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f3ee">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="販売カウンター">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>商品登録 | 販売カウンター</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="icon" href="./icon-180.png" type="image/png">
  <style>
    :root {
      color-scheme: light;
      --paper: #f5f3ee;
      --panel: #fffefa;
      --ink: #292820;
      --muted: #77766c;
      --line: #e4e1d8;
      --accent: #e05b3f;
      --accent-dark: #bd422c;
      --sans: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", Meiryo, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 3px solid #e8a08f; outline-offset: 2px; }
    .wrap { max-width: 860px; margin: auto; padding: 28px 22px 60px; }
    header { display: flex; justify-content: space-between; align-items: flex-start; gap: 18px; margin-bottom: 22px; }
    .eyebrow { margin: 0 0 5px; color: var(--accent-dark); font-size: .75rem; font-weight: 800; letter-spacing: .14em; }
    h1 { margin: 0; font-size: clamp(1.7rem, 4vw, 2.3rem); letter-spacing: -.04em; }
    .lead { margin: 8px 0 0; color: var(--muted); font-size: .9rem; }
    .button { display: inline-flex; align-items: center; justify-content: center; border: 1px solid var(--line); border-radius: 9px; background: var(--panel); color: var(--ink); padding: 9px 13px; font-weight: 750; text-decoration: none; }
    .button:hover { border-color: #b7b2a5; }
    .button.small { padding: 7px 10px; font-size: .82rem; }
    .button.danger { color: #a63d2b; }
    .notice { display: none; margin: 0 0 16px; padding: 11px 14px; border: 1px solid #e3b2a6; border-radius: 10px; background: #fff2ee; color: #923d2c; font-size: .9rem; }
    .notice.show { display: block; }
    .panel { margin-bottom: 16px; border: 1px solid var(--line); border-radius: 15px; background: var(--panel); box-shadow: 0 5px 18px #37301a08; }
    .panel-inner { padding: 19px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 15px; }
    h2 { margin: 0; font-size: 1.1rem; letter-spacing: -.02em; }
    .subtle { color: var(--muted); font-size: .82rem; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; }
    label { display: grid; gap: 6px; color: #55544b; font-size: .82rem; font-weight: 750; }
    input[type="text"] { width: 100%; min-width: 0; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); padding: 10px 11px; }
    input::placeholder { color: #aaa79c; }
    .image-label { grid-column: 1 / -1; }
    .image-picker { display: flex; align-items: center; gap: 12px; }
    .preview { display: grid; width: 82px; height: 82px; flex: 0 0 82px; place-items: center; overflow: hidden; border: 1px dashed #c9c4b8; border-radius: 10px; background: #f0eee7; color: #979386; font-size: 1.5rem; }
    .preview img { width: 100%; height: 100%; object-fit: cover; }
    input[type="file"] { width: 100%; color: var(--muted); font-size: .78rem; }
    .image-controls { display: grid; gap: 8px; }
    .form-actions { grid-column: 1 / -1; display: flex; gap: 8px; margin-top: 2px; }
    .primary { flex: 1; border: 0; border-radius: 9px; background: var(--accent); color: white; padding: 11px 14px; font-weight: 800; }
    .primary:hover { background: var(--accent-dark); }
    .product-list { display: grid; gap: 10px; }
    .product-card { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto; align-items: center; gap: 13px; padding: 12px; border: 1px solid var(--line); border-radius: 12px; background: #fff; }
    .product-thumb { display: grid; width: 72px; height: 72px; place-items: center; overflow: hidden; border-radius: 9px; background: #f0eee7; color: #969184; font-size: 1.4rem; }
    .product-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { min-width: 0; }
    .product-name { overflow-wrap: anywhere; margin: 0; font-size: 1rem; font-weight: 800; }
    .product-person { margin: 4px 0 0; color: var(--muted); font-size: .8rem; }
    .card-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 6px; }
    .empty { padding: 26px 12px; color: var(--muted); text-align: center; font-size: .9rem; }
    @media (max-width: 580px) {
      .wrap { padding: 22px 14px 40px; }
      header { flex-direction: column; }
      .form-grid { grid-template-columns: 1fr; }
      .image-label, .form-actions { grid-column: 1; }
      .product-card { grid-template-columns: 58px minmax(0, 1fr); gap: 10px; }
      .product-thumb { width: 58px; height: 58px; }
      .card-actions { grid-column: 1 / -1; justify-content: flex-end; }
      .panel-inner { padding: 15px; }
    }
  </style>
</head>
<body>
  <main class="wrap">
    <header>
      <div>
        <p class="eyebrow">PRODUCT MANAGEMENT</p>
        <h1>商品登録</h1>
        <p class="lead">商品の画像・名前・担当者を登録、編集できます。</p>
      </div>
      <a class="button" href="./index.html">販売カウンターへ戻る</a>
    </header>

    <div class="notice" id="appNotice" role="status" aria-live="polite"></div>
    <div class="notice" id="notice" role="status" aria-live="polite"></div>
    <section class="panel" aria-labelledby="formTitle">
      <div class="panel-inner">
        <div class="section-heading">
          <h2 id="formTitle">商品を追加</h2>
          <span class="subtle">画像はなくても登録できます</span>
        </div>
        <form id="productForm" class="form-grid">
          <label class="image-label">サムネイル画像
            <div class="image-picker">
              <div class="preview" id="imagePreview" aria-label="画像プレビュー">＋</div>
              <div class="image-controls">
                <input id="imageInput" type="file" accept="image/*">
                <button class="button small" id="clearImageButton" type="button">画像を外す</button>
              </div>
            </div>
          </label>
          <label for="titleInput">商品名
            <input id="titleInput" type="text" maxlength="100" placeholder="例：新刊セット" required>
          </label>
          <label for="personInput">担当者名
            <input id="personInput" type="text" maxlength="60" placeholder="例：山田" required>
          </label>
          <div class="form-actions">
            <button class="primary" id="saveProductButton" type="submit">商品を追加</button>
            <button class="button" id="cancelEditButton" type="button" hidden>キャンセル</button>
          </div>
        </form>
      </div>
    </section>

    <section class="panel" aria-labelledby="productsTitle">
      <div class="panel-inner">
        <div class="section-heading">
          <h2 id="productsTitle">登録済みの商品</h2>
          <span class="subtle" id="productCount"></span>
        </div>
        <div class="product-list" id="productList"></div>
      </div>
    </section>
  </main>
  <script>
    (() => {
      'use strict';
      const STORAGE_KEY = 'counter-timed-data-v1';
      const state = { products: [], events: [], editingId: null, draftImage: '' };
      const $ = (selector) => document.querySelector(selector);
      const notice = $('#notice');

      function showNotice(message) {
        notice.textContent = message;
        notice.classList.add('show');
      }

      function clearNotice() {
        notice.textContent = '';
        notice.classList.remove('show');
      }

      function saveState() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify({ products: state.products, events: state.events }));
          clearNotice();
          return true;
        } catch (error) {
          showNotice(`保存できませんでした。端末の空き容量を確認してください。(${error.message})`);
          return false;
        }
      }

      function loadState() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return;
        const data = JSON.parse(raw);
        if (!data || !Array.isArray(data.products) || !Array.isArray(data.events)) {
          throw new Error('保存データの形式が正しくありません。');
        }
        state.products = data.products;
        state.events = data.events;
      }

      function esc(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
        })[char]);
      }

      function renderPreview(image) {
        $('#imagePreview').innerHTML = image ? `<img src="${image}" alt="選択した画像">` : '＋';
      }

      function renderProducts() {
        $('#productCount').textContent = `${state.products.length}件`;
        $('#productList').innerHTML = state.products.length
          ? state.products.map((product) => `<article class="product-card">
              <div class="product-thumb">${product.image ? `<img src="${product.image}" alt="">` : '▧'}</div>
              <div class="product-info">
                <p class="product-name">${esc(product.title)}</p>
                <p class="product-person">担当：${esc(product.person)}</p>
              </div>
              <div class="card-actions">
                <button class="button small" type="button" data-action="edit" data-id="${esc(product.id)}">編集</button>
                <button class="button small danger" type="button" data-action="remove" data-id="${esc(product.id)}">削除</button>
              </div>
            </article>`).join('')
          : '<div class="empty">商品はまだありません。</div>';
      }

      function resetForm() {
        state.editingId = null;
        state.draftImage = '';
        $('#productForm').reset();
        $('#formTitle').textContent = '商品を追加';
        $('#saveProductButton').textContent = '商品を追加';
        $('#cancelEditButton').hidden = true;
        $('#imageInput').value = '';
        renderPreview('');
      }

      $('#productForm').addEventListener('submit', (event) => {
        event.preventDefault();
        const title = $('#titleInput').value.trim();
        const person = $('#personInput').value.trim();
        if (!title || !person) {
          showNotice('商品名と担当者名を入力してください。');
          return;
        }
        let previousProduct = null;
        if (state.editingId) {
          const product = state.products.find((item) => item.id === state.editingId);
          if (!product) {
            showNotice('編集中の商品が見つかりません。');
            resetForm();
            return;
          }
          previousProduct = { ...product };
          product.title = title;
          product.person = person;
          product.image = state.draftImage;
        } else {
          state.products.push({
            id: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
            title, person, image: state.draftImage
          });
        }
        if (saveState()) {
          resetForm();
          renderProducts();
        } else if (previousProduct) {
          const index = state.products.findIndex((item) => item.id === previousProduct.id);
          if (index >= 0) state.products[index] = previousProduct;
        } else {
          state.products.pop();
        }
      });

      $('#imageInput').addEventListener('change', (event) => {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        if (!file.type.startsWith('image/')) {
          showNotice('画像ファイルを選択してください。');
          event.target.value = '';
          return;
        }
        const reader = new FileReader();
        reader.onerror = () => showNotice('画像を読み込めませんでした。別の画像をお試しください。');
        reader.onload = () => {
          const image = new Image();
          image.onerror = () => showNotice('画像を開けませんでした。別の画像をお試しください。');
          image.onload = () => {
            const max = 500;
            const scale = Math.min(1, max / Math.max(image.naturalWidth, image.naturalHeight));
            const canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(image.naturalWidth * scale));
            canvas.height = Math.max(1, Math.round(image.naturalHeight * scale));
            const context = canvas.getContext('2d');
            if (!context) {
              showNotice('画像を処理できませんでした。');
              return;
            }
            context.drawImage(image, 0, 0, canvas.width, canvas.height);
            state.draftImage = canvas.toDataURL('image/jpeg', 0.82);
            renderPreview(state.draftImage);
            clearNotice();
          };
          image.src = reader.result;
        };
        reader.readAsDataURL(file);
      });

      $('#clearImageButton').addEventListener('click', () => {
        state.draftImage = '';
        $('#imageInput').value = '';
        renderPreview('');
      });

      $('#productList').addEventListener('click', (event) => {
        const button = event.target.closest('button[data-action]');
        if (!button) return;
        const product = state.products.find((item) => item.id === button.dataset.id);
        if (!product) return;
        if (button.dataset.action === 'edit') {
          state.editingId = product.id;
          state.draftImage = product.image || '';
          $('#titleInput').value = product.title;
          $('#personInput').value = product.person;
          $('#formTitle').textContent = '商品を編集';
          $('#saveProductButton').textContent = '変更を保存';
          $('#cancelEditButton').hidden = false;
          renderPreview(state.draftImage);
          window.scrollTo({ top: 0, behavior: 'smooth' });
          return;
        }
        if (button.dataset.action === 'remove' && window.confirm(`「${product.title}」を商品一覧から削除しますか？販売記録は残ります。`)) {
          const previousProducts = state.products;
          state.products = previousProducts.filter((item) => item.id !== product.id);
          if (saveState()) {
            if (state.editingId === product.id) resetForm();
            renderProducts();
          } else {
            state.products = previousProducts;
          }
        }
      });

      $('#cancelEditButton').addEventListener('click', resetForm);

      try {
        loadState();
        renderProducts();
      } catch (error) {
        showNotice(`保存データを読み込めませんでした。(${error.message})`);
        $('#productList').innerHTML = '<div class="empty">保存データを読み込めませんでした。</div>';
      }
    })();
  </script>
  <script src="./app.js"></script>
</body>
</html>
